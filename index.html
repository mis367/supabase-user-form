<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Registration</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f6; padding: 16px; }
  .card { background: #fff; width: 100%; max-width: 420px; padding: 28px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { margin: 0 0 20px; color: #6b7280; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
  input:focus { outline: 2px solid #3ecf8e; border-color: #3ecf8e; }
  button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #3ecf8e; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  .ok { color: #059669; } .err { color: #dc2626; }
</style>
</head>
<body>
  <div class="card">
    <h1>User Registration</h1>
    <p class="sub">Apni details bharein aur submit karein.</p>

    <form id="userForm">
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" required placeholder="Rahul Sharma">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="rahul@example.com">

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" pattern="[0-9+\-\s]{7,15}" placeholder="9876543210">

      <label for="city">City</label>
      <input id="city" name="city" type="text" placeholder="Mumbai">

      <button type="submit" id="btn">Submit</button>
      <div id="msg"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 👇 Supabase Dashboard > Project Settings > API se copy karke yahan paste karein
    const SUPABASE_URL = "https://jedsdpfpumrxfncdpcrd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_EcK2vdug7z2M77TXBX4-zw_ge2vpL4c";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("userForm");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.className = ""; msg.textContent = "Saving...";

      const row = {
        name: form.name.value.trim(),
        email: form.email.value.trim().toLowerCase(),
        phone: form.phone.value.trim() || null,
        city: form.city.value.trim() || null,
      };

      const { error } = await db.from("users").insert(row);

      if (error) {
        msg.className = "err";
        msg.textContent = error.code === "23505"
          ? "Ye email pehle se registered hai."
          : "Error: " + error.message;
      } else {
        msg.className = "ok";
        msg.textContent = "✅ Data save ho gaya!";
        form.reset();
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
